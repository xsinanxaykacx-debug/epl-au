name: Match Key Audit

on:
  push:
    branches: [main]
    paths:
      - "audit_match_keys_v1.py"
      - "build_h1_features_v2.py"
      - "compare_h1_features_rebuild.py"
      - "h9_inventory.py"
      - "h9_explore_v1.py"
      - "E0.csv"
      - "E0 (1).csv"
      - "E0 (2).csv"
      - "E0 (3).csv"
      - "E0 (4).csv"
      - "E0 (5).csv"
      - "E0 (6).csv"
      - "E0 (7).csv"
      - "E0 (8).csv"
      - "E0 (9).csv"
      - "h1_features_v2.csv"
      - ".github/workflows/audit-match-keys.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy openpyxl

      - name: Preserve current feature file for comparison
        run: |
          mkdir -p audit_match_keys_v1_output
          cp h1_features_v2.csv /tmp/h1_features_v2_before.csv

      - name: Rebuild H1 features from historical seasons only
        run: python build_h1_features_v2.py

      - name: Compare committed features with clean rebuild
        run: |
          python compare_h1_features_rebuild.py \
            --before /tmp/h1_features_v2_before.csv \
            --after h1_features_v2.csv \
            --out audit_match_keys_v1_output

      - name: Run read-only match-key audit
        run: python audit_match_keys_v1.py

      - name: Run H9 inventory validation (no model fitting)
        run: python h9_inventory.py

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-key-audit-reports
          path: audit_match_keys_v1_output/
          if-no-files-found: warn
          retention-days: 14
