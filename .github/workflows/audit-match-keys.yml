name: Match Key Audit

on:
  push:
    branches: [main]
    paths:
      - "audit_match_keys_v1.py"
      - "audit_date_parsing_v1.py"
      - "h2_explore_v1.py"
      - "h3_explore_v1.py"
      - "h4_explore_v1.py"
      - "h5_explore_v1.py"
      - "h6_explore_v1.py"
      - "h7_inventory.py"
      - "h8_explore_v1.py"
      - "h8_edge_v1.py"
      - "h3_inventory.py"
      - "h4_inventory.py"
      - "h5_inventory.py"
      - "h6_inventory.py"
      - "h8_inventory.py"
      - "h8_edge_inventory.py"
      - "h1_edge_v1.py"
      - "roi_edge_v1.py"
      - "validation_v1.py"
      - "confirmation_v1.py"
      - "inventory_h1.py"
      - "build_h1_features_v2.py"
      - "compare_h1_features_rebuild.py"
      - "compare_h9_results.py"
      - "compare_workbooks_v1.py"
      - "h9_inventory.py"
      - "h9_explore_v1.py"
      - "h12_favourite_longshot.py"
      - "audit_ou25.py"
      - "build_h1_features.py"
      - "h13_corner_market.py"
      - "h14_optimal_odds_band.py"
      - "E0.csv"
      - "E0 (1).csv"
      - "E0 (2).csv"
      - "E0 (3).csv"
      - "E0 (4).csv"
      - "E0 (5).csv"
      - "E0 (6).csv"
      - "E0 (7).csv"
      - "E0 (8).csv"
      - "E0 (9).csv"
      - "h1_features_v2.csv"
      - ".github/workflows/audit-match-keys.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy openpyxl scipy scikit-learn statsmodels

      - name: Preserve current feature files for comparison
        run: |
          mkdir -p audit_match_keys_v1_output
          cp h1_features_v2.csv /tmp/h1_features_v2_before.csv
          cp h1_features.csv /tmp/h1_features_v1_before.csv
          cp inventory_h1.xlsx /tmp/inventory_h1_before.xlsx
          cp h1_edge_v1_results.xlsx /tmp/h1_edge_v1_results_before.xlsx
          cp roi_edge_v1_results.xlsx /tmp/roi_edge_v1_results_before.xlsx
          cp validation_v1_results.xlsx /tmp/validation_v1_results_before.xlsx
          cp confirmation_v1_results.xlsx /tmp/confirmation_v1_results_before.xlsx

      - name: Rebuild H1 features from historical seasons only
        run: python build_h1_features_v2.py

      - name: Compare committed features with clean rebuild
        run: |
          python compare_h1_features_rebuild.py \
            --before /tmp/h1_features_v2_before.csv \
            --after h1_features_v2.csv \
            --out audit_match_keys_v1_output

      - name: Rebuild legacy H1 feature script with mixed-format parsing
        run: python build_h1_features.py

      - name: Compare legacy H1 builder output before and after parser fix
        run: |
          python compare_h1_features_rebuild.py \
            --before /tmp/h1_features_v1_before.csv \
            --after h1_features.csv \
            --out audit_match_keys_v1_output/legacy_h1_builder_comparison

      - name: Run repository-wide date parsing audit
        run: python audit_date_parsing_v1.py

      - name: Run read-only match-key audit
        run: python audit_match_keys_v1.py

      - name: Run H9 inventory validation (no model fitting)
        run: python h9_inventory.py

      - name: Preserve prior frozen H9 results
        run: cp h9_explore_v1_results.xlsx /tmp/h9_explore_v1_results_before.xlsx

      - name: Preserve prior H12 results
        run: cp h12_favourite_longshot_results.xlsx /tmp/h12_favourite_longshot_results_before.xlsx

      - name: Preserve prior H13 and H14 results
        run: |
          cp h13_corner_market_results.xlsx /tmp/h13_corner_market_results_before.xlsx
          cp h14_optimal_odds_band_results.xlsx /tmp/h14_optimal_odds_band_results_before.xlsx

      - name: Re-run frozen H9 Explore protocol (first run)
        run: python h9_explore_v1.py

      - name: Save first corrected H9 run
        run: cp h9_explore_v1_results.xlsx /tmp/h9_explore_v1_first_run.xlsx

      - name: Compare corrected H9 run with committed baseline
        run: |
          python compare_h9_results.py \
            --before /tmp/h9_explore_v1_results_before.xlsx \
            --after /tmp/h9_explore_v1_first_run.xlsx \
            --out audit_match_keys_v1_output/baseline_comparison

      - name: Repeat frozen H9 Explore to test determinism
        run: python h9_explore_v1.py

      - name: Compare two corrected H9 runs
        run: |
          python compare_h9_results.py \
            --before /tmp/h9_explore_v1_first_run.xlsx \
            --after h9_explore_v1_results.xlsx \
            --out audit_match_keys_v1_output/repeat_comparison

      - name: Copy regenerated H9 workbook into report artifact
        run: cp h9_explore_v1_results.xlsx audit_match_keys_v1_output/h9_explore_v1_results_regenerated.xlsx

      - name: Re-run H12 with corrected drawdown date parsing
        run: python h12_favourite_longshot.py

      - name: Save first corrected H12 run
        run: cp h12_favourite_longshot_results.xlsx /tmp/h12_favourite_longshot_results_first.xlsx

      - name: Compare corrected H12 output with prior workbook
        run: |
          python compare_workbooks_v1.py \
            --before /tmp/h12_favourite_longshot_results_before.xlsx \
            --after /tmp/h12_favourite_longshot_results_first.xlsx \
            --out audit_match_keys_v1_output/h12_baseline_comparison

      - name: Repeat H12 to test deterministic results
        run: python h12_favourite_longshot.py

      - name: Compare repeated corrected H12 outputs
        run: |
          python compare_workbooks_v1.py \
            --before /tmp/h12_favourite_longshot_results_first.xlsx \
            --after h12_favourite_longshot_results.xlsx \
            --out audit_match_keys_v1_output/h12_repeat_comparison

      - name: Copy regenerated H12 workbook into report artifact
        run: cp h12_favourite_longshot_results.xlsx audit_match_keys_v1_output/h12_favourite_longshot_results_regenerated.xlsx

      - name: Run O/U 2.5 data audit with robust date normalization
        run: python audit_ou25.py

      - name: Copy O/U 2.5 audit CSV into report artifact
        run: cp ou25_match_audit.csv audit_match_keys_v1_output/ou25_match_audit.csv

      - name: Run H13 corner-market analysis with robust dates
        run: python h13_corner_market.py

      - name: Compare H13 output with prior workbook
        run: |
          cp h13_corner_market_results.xlsx /tmp/h13_corner_market_results_first.xlsx
          python compare_workbooks_v1.py \
            --before /tmp/h13_corner_market_results_before.xlsx \
            --after /tmp/h13_corner_market_results_first.xlsx \
            --out audit_match_keys_v1_output/h13_baseline_comparison

      - name: Repeat H13 and compare determinism
        run: |
          python h13_corner_market.py
          python compare_workbooks_v1.py \
            --before /tmp/h13_corner_market_results_first.xlsx \
            --after h13_corner_market_results.xlsx \
            --out audit_match_keys_v1_output/h13_repeat_comparison

      - name: Copy regenerated H13 workbook into report artifact
        run: cp h13_corner_market_results.xlsx audit_match_keys_v1_output/h13_corner_market_results_regenerated.xlsx

      - name: Run H14 optimal-odds-band analysis with robust dates
        run: python h14_optimal_odds_band.py

      - name: Compare H14 output with prior workbook
        run: |
          cp h14_optimal_odds_band_results.xlsx /tmp/h14_optimal_odds_band_results_first.xlsx
          python compare_workbooks_v1.py \
            --before /tmp/h14_optimal_odds_band_results_before.xlsx \
            --after /tmp/h14_optimal_odds_band_results_first.xlsx \
            --out audit_match_keys_v1_output/h14_baseline_comparison

      - name: Repeat H14 and compare determinism
        run: |
          python h14_optimal_odds_band.py
          python compare_workbooks_v1.py \
            --before /tmp/h14_optimal_odds_band_results_first.xlsx \
            --after h14_optimal_odds_band_results.xlsx \
            --out audit_match_keys_v1_output/h14_repeat_comparison

      - name: Copy regenerated H14 workbook into report artifact
        run: cp h14_optimal_odds_band_results.xlsx audit_match_keys_v1_output/h14_optimal_odds_band_results_regenerated.xlsx

      - name: Preserve H2-H8 inventory and model baselines
        run: |
          for f in h3_inventory.xlsx h4_inventory.xlsx h5_inventory.xlsx h6_inventory.xlsx h8_inventory.xlsx h8_edge_inventory.xlsx h2_explore_v1_results.xlsx h3_explore_v1_results.xlsx h4_explore_v1_results.xlsx h5_explore_v1_results.xlsx h6_explore_v1_results.xlsx h8_explore_v1_results.xlsx h8_edge_v1_results.xlsx; do
            cp "$f" "/tmp/${f%.xlsx}_before.xlsx"
          done

      - name: Rebuild H2-H8 data inventories
        run: |
          set -e
          python inventory_h1.py
          python h3_inventory.py
          python h4_inventory.py
          python h5_inventory.py
          python h6_inventory.py
          python h8_inventory.py
          python h8_edge_inventory.py

      - name: Run H7 inventory diagnostic (B365HC availability)
        continue-on-error: true
        run: python h7_inventory.py

      - name: Compare regenerated inventories with committed baselines
        run: |
          set -e
          for f in h3_inventory.xlsx h4_inventory.xlsx h5_inventory.xlsx h6_inventory.xlsx h8_inventory.xlsx h8_edge_inventory.xlsx; do
            base="${f%.xlsx}"
            python compare_workbooks_v1.py --before "/tmp/${base}_before.xlsx" --after "$f" --out "audit_match_keys_v1_output/${base}_baseline_comparison"
            cp "$f" "audit_match_keys_v1_output/${base}_regenerated.xlsx"
          done
          python compare_workbooks_v1.py --before /tmp/inventory_h1_before.xlsx --after inventory_h1.xlsx --out audit_match_keys_v1_output/inventory_h1_baseline_comparison
          cp inventory_h1.xlsx audit_match_keys_v1_output/inventory_h1_regenerated.xlsx
          cp h7_inventory.xlsx audit_match_keys_v1_output/h7_inventory_regenerated.xlsx

      - name: Re-run frozen H2-H8 Explore and Edge protocols
        run: |
          set -e
          python h2_explore_v1.py
          python h3_explore_v1.py
          python h4_explore_v1.py
          python h5_explore_v1.py
          python h6_explore_v1.py
          python h8_explore_v1.py
          python h8_edge_v1.py

      - name: Compare H2-H8 outputs with committed baselines
        run: |
          set -e
          for f in h2_explore_v1_results.xlsx h3_explore_v1_results.xlsx h4_explore_v1_results.xlsx h5_explore_v1_results.xlsx h6_explore_v1_results.xlsx h8_explore_v1_results.xlsx h8_edge_v1_results.xlsx; do
            base="${f%.xlsx}"
            python compare_workbooks_v1.py --before "/tmp/${base}_before.xlsx" --after "$f" --out "audit_match_keys_v1_output/${base}_baseline_comparison"
            cp "$f" "audit_match_keys_v1_output/${base}_regenerated.xlsx"
          done

      - name: Re-run frozen H1 Edge, ROI Edge, Validation and Confirmation
        run: |
          set -e
          python h1_edge_v1.py
          python roi_edge_v1.py
          python validation_v1.py
          python confirmation_v1.py

      - name: Compare frozen H1 Edge and prior research outputs
        run: |
          set -e
          python compare_workbooks_v1.py --before /tmp/h1_edge_v1_results_before.xlsx --after h1_edge_v1_results.xlsx --out audit_match_keys_v1_output/h1_edge_baseline_comparison
          python compare_workbooks_v1.py --before /tmp/roi_edge_v1_results_before.xlsx --after roi_edge_v1_results.xlsx --out audit_match_keys_v1_output/roi_edge_baseline_comparison
          python compare_workbooks_v1.py --before /tmp/validation_v1_results_before.xlsx --after validation_v1_results.xlsx --out audit_match_keys_v1_output/validation_baseline_comparison
          python compare_workbooks_v1.py --before /tmp/confirmation_v1_results_before.xlsx --after confirmation_v1_results.xlsx --out audit_match_keys_v1_output/confirmation_baseline_comparison
          cp h1_edge_v1_results.xlsx audit_match_keys_v1_output/h1_edge_v1_results_regenerated.xlsx
          cp roi_edge_v1_results.xlsx audit_match_keys_v1_output/roi_edge_v1_results_regenerated.xlsx
          cp validation_v1_results.xlsx audit_match_keys_v1_output/validation_v1_results_regenerated.xlsx
          cp confirmation_v1_results.xlsx audit_match_keys_v1_output/confirmation_v1_results_regenerated.xlsx

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-key-audit-reports
          path: audit_match_keys_v1_output/
          if-no-files-found: warn
          retention-days: 14
